:root{

  --display:"Barlow Condensed",sans-serif; --corpo:"Archivo",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg);font-family:var(--corpo);color:var(--tinta);-webkit-font-smoothing:antialiased}
.peca{position:relative;width:1080px;height:1350px;overflow:hidden;padding:64px}
.peca.roxa{background:var(--roxo);color:var(--branco)}
.peca.menta{background:var(--menta-claro)}
.logo{position:absolute;top:56px;right:64px;width:200px}
.display{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.92;letter-spacing:-.005em}
.kicker{font-family:var(--corpo);font-weight:600;font-size:22px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.roxa .kicker{color:var(--menta)}
.corpo{font-family:var(--corpo);font-weight:500;font-size:30px;line-height:1.3}
/* Selo: número grande + legenda, no padrão dos posts da marca no Instagram */
.selo{position:relative;width:190px;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--roxo);filter:drop-shadow(0 6px 10px rgba(43,33,48,.14))}
.peca > .selo{position:absolute}
.selo svg{position:absolute;inset:0;width:100%;height:100%}
.selo .n{position:relative;font-family:var(--display);font-weight:800;font-size:62px;line-height:1;letter-spacing:-.01em}
.selo .n small{font-size:.62em;font-weight:700}
.selo .l{position:relative;font-family:var(--corpo);font-weight:600;font-size:22px;line-height:1.05;margin-top:6px;max-width:130px}
.selo.sm{width:150px;height:150px}.selo.sm .n{font-size:48px}.selo.sm .l{font-size:18px;max-width:105px}
.selo.lg{width:230px;height:230px}.selo.lg .n{font-size:78px}.selo.lg .l{font-size:25px;max-width:160px}
.pill{display:inline-flex;align-items:center;gap:12px;padding:16px 30px;border-radius:999px;background:var(--roxo);color:var(--branco);font-family:var(--display);font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.02em}
.pill.outline{background:transparent;border:3px solid var(--roxo);color:var(--roxo)}
.roxa .pill{background:var(--branco);color:var(--roxo)}
.roxa .selo{filter:drop-shadow(0 8px 14px rgba(0,0,0,.28))}
.rodape{position:absolute;left:64px;right:64px;bottom:44px;display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--corpo);font-weight:600;font-size:22px;color:var(--muted);letter-spacing:.5px}
.roxa .rodape{color:rgba(255,255,255,.72)}
.nota{font-family:var(--corpo);font-weight:400;font-size:17px;line-height:1.3;color:var(--muted);max-width:640px}
.roxa .nota{color:rgba(255,255,255,.7)}
.acento{color:var(--roxo)} .roxa .acento{color:var(--menta)}

#root{width:100%;height:100%;position:relative;overflow:hidden}
.peca{position:absolute;left:0;top:0}
.titulo .w{display:inline-block}

.k{position:absolute;left:0;right:0;top:78px;text-align:center}
.titulo{position:absolute;left:64px;right:64px;top:150px;text-align:center;font-size:120px;line-height:1.0;color:var(--branco)}
.titulo .acento{color:var(--menta)}
.cup{position:absolute;left:50%;top:560px;height:560px;filter:drop-shadow(0 26px 26px rgba(0,0,0,.35))}
.apoio{position:absolute;left:64px;right:64px;top:1150px;text-align:center;color:var(--branco);font-family:var(--corpo)}
.apoio b{display:block;font-weight:700;font-size:36px;line-height:1.15}
.apoio span{display:block;font-weight:400;font-size:28px;line-height:1.25;margin-top:8px;color:rgba(255,255,255,.82)}

</style>
